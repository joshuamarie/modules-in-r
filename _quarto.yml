project:
  type: book
  output-dir: docs
  execute-dir: project
  pre-render: setup-modules.r
  render:
    - "*.qmd"

book:
  title: "Box: Placing module system into R"
  reader-mode: true
  keyword: box, carrier, module, package, module system, modular programming, package management
  
  subtitle: "Definitive Guide"
  author:
    - name: "Joshua Marie"
    - name: "John Riz Bagnol"
  # optional: author, date, subtitle, image, etc.
  sidebar:
    style: floating
    search: true
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "1 Introduction"
      chapters:
        - text: "1.1 Introduction"
          href: Chapter 1/1-intro.qmd
        - text: "1.2 Getting Started"
          href: Chapter 1/2-get-started.qmd
    - part: "2 Fundamentals of import system in {box} package"
      chapters:
        - text: "2.1 {box} Fundamentals"
          href: Chapter 2/1-box-fundamentals.qmd
        - text: "2.2 Array of imports and monikers"
          href: Chapter 2/2-imports.qmd
        - text: "2.3 Reloading modules"
          href: Chapter 2/3-reloading-modules.qmd
    - part: "3 Employment of Modules: Structures and constructions"
      chapters:
        - text: "3.1 Structures and constructions"
          href: Chapter 3/1-struct-module.qmd
        - text: "3.2 Initialization"
          href: Chapter 3/2-struct-module-1.qmd
        - text: "3.3 Package-like Modules"
          href: Chapter 3/3-struct-module-2.qmd
        - text: "3.4 Reading and adding data"
          href: Chapter 3/4-add-data.qmd
        - text: "3.5 Deep Nested Modules"
          href: Chapter 3/5-nested-modules.qmd
        # - Chapter 3/3.5-compiled-codes.qmd
    - part: "4 Testing Modules"
      chapters:
        - text: "4.1 Unit Testing Modules"
          href: Chapter 4/1-testing-modules.qmd
        - text: "4.2 Setting Up Module Tests"
          href: Chapter 4/2-testthat-1.qmd
        - text: "4.3 Unit Test Diagnostics"
          href: Chapter 4/3-testthat-2.qmd
    - part: "5 \"Packaged\" Box Modules"
      chapters:
        - text: "5.1 Overview on packaged modules"
          href: Chapter 5/1-box-packages.qmd
        - text: "5.2 {carrier}: Writing Module Packages"
          href: Chapter 5/2-writing-packages.qmd
        - text: "5.3 Bundle and Installation"
          href: Chapter 5/3-bundle-install.qmd
          

  repo-url: https://github.com/joshuamarie/modules-in-r
  repo-actions: [edit, issue]

site-url: https://modules-in-r.joshuamarie.com

format:
  html:
    theme:
      light: [cosmo, custom-light.scss]
      dark: [darkly, custom-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    bread-crumbs: false  
  pdf:
    number-sections: false
    toc: true

execute:
  warning: false
  message: false
  echo: true
  # freeze: auto
